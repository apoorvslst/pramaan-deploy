services:
  # 1. Python FastAPI AI Microservice
  - type: web
    name: praman-ai-service
    runtime: python
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FALLBACK_GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./data/chromadb
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2

  # 2. Node.js Express Backend API
  - type: web
    name: praman-backend-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: praman-ai-service
          property: host

  # 3. React Vite Frontend (Static Site)
  - type: web
    name: praman-frontend-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: praman-backend-api
          property: host
